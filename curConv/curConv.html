<template>
    <lightning-card title="Currency Converter" class="formatfile">
        <div class="container">
        <div >
        <lightning-input label="Enter Amount" required onchange={changeHandler} name="amount">

        </lightning-input>
        </div>
        <div>
            <div class="slds-grid slds-gutters">
                <div class="slds-col">
                <lightning-combobox label="From Currency" onchange={changeHandler} name="fromcurr"
                options={currencyoptions}></lightning-combobox>
                </div>
                <div class="slds-col">
                <lightning-combobox label="To Currency" onchange={changeHandler} name="tocurr"
                options={currencyoptions}></lightning-combobox>
                </div>
                </div>
        </div>
        <div>
         <lightning-button label="Convert" onclick={clickHandler} ></lightning-button>
        </div>
        <template lwc:if={showOutput}>
        <div>
         <p>Converted Value :</p>
            <p><lightning-formatted-number value={convertedValue} format-style="currency"
                 currency-code={toCurrency} currency-display-as="name">

            </lightning-formatted-number></p>
         </p></div>
        </template>
    </div>

    </lightning-card>
</template>
