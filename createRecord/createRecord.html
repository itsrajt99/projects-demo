<template>
    <lightning-card title="Create Record">
        <div class="slds-var-p-around_small">
            <lightning-combobox
            name="parentacc"
            label="Parent Account"
            placeholder="Select Parent Account"
            options={parentoptions}
            onchange={handleChange} 
            required="true"
            message-when-value-missing="Please select Parent account"
            class="validateme"></lightning-combobox>

            <lightning-input 
            label="Account Name"
            placeholder="Enter Account Name"
            onchange={handleChange}
            name="accname"
            required="true"
            type="text"
            min-length="2"
            max-length="80"
            class="validateme">

            </lightning-input>

            <lightning-input
            type="Date"
            onchange={handleChange}
            label="SLA Date"
            name="slaexpdt">
            </lightning-input>
            <template lwc:if={slapicklist.data}>
            <lightning-radio-group name="slatype"
            label="SLA Type"
            onchange={handleChange}
            options={slapicklist.data.values}
            type="button">
          </lightning-radio-group>
        </template>
            
          <lightning-slider label="Number of location" 
          min="1"
          max="50"
          step="1"
          value={selnooflocations}
          onchange={handleChange}
          name="nooflocation"
          ></lightning-slider>

          <lightning-input-rich-text
          label="Description"
          name="description"
          onchange={handleChange}>
      </lightning-input-rich-text>
        </div>
        <div class="slds-var-p-around_small">
            <lightning-button label="Save" variant="brand" onclick={saveRecord}></lightning-button>
        </div>
    </lightning-card>
</template>
